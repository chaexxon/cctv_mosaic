<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CCTV Mosaic System</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
            background:#f5f5f5;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        h1{
            text-align:center;
        }

        input{
            width:100%;
            margin-top:10px;
            margin-bottom:20px;
            padding:10px;
        }

        button{
            width:100%;
            padding:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        video{
            width:100%;
            margin-top:30px;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>CCTV 모자이크 시스템</h1>

    <form action="/process" method="post" enctype="multipart/form-data">

        <label>영상 업로드</label>
        <input type="file" name="video" required>

        <label>시작 시간 (예: 00:00:05)</label>
        <input type="text" name="start_time" required>

        <label>종료 시간 (예: 00:00:20)</label>
        <input type="text" name="end_time" required>

        <label>모자이크 해제할 얼굴 사진</label>
        <input type="file" name="face_images" multiple>

        <label>모자이크 해제할 번호판</label>
        <input type="text" name="plate_number">

        <button type="submit">
            영상 처리 시작
        </button>

    </form>

    {% if video_url %}

    <h2>처리 결과</h2>

    <video controls>
        <source src="{{ video_url }}" type="video/mp4">
    </video>

    {% endif %}

</div>

</body>
</html>
