<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CCTV Mosaic System</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            width: 760px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button.secondary {
            background: #374151;
        }

        button.secondary:hover {
            background: #111827;
        }

        button.success {
            background: #16a34a;
        }

        button.success:hover {
            background: #15803d;
        }

        .camera-box {
            margin-top: 20px;
            padding: 18px;
            background: #f9fafb;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #cameraPreview {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            background: black;
            display: none;
        }

        .photo-list {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .photo-list img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #2563eb;
        }

        .small-text {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .loading-box {
            display: none;
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: #f0f9ff;
            color: #075985;
            font-weight: bold;
        }

        progress {
            width: 100%;
            height: 24px;
            margin-top: 10px;
        }

        video.result-video {
            width: 100%;
            margin-top: 30px;
            border-radius: 10px;
            background: black;
        }

        .download {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CCTV 모자이크 시스템</h1>

    <form id="processForm" action="/process" method="post" enctype="multipart/form-data">

        <label>영상 업로드</label>
        <input type="file" name="video" accept="video/*" required>

        <label>시작 시간 (예: 0 또는 00:00:00)</label>
        <input type="text" name="start_time" required>

        <label>종료 시간 (예: 5 또는 00:00:05)</label>
        <input type="text" name="end_time" required>

        <label>모자이크 해제할 얼굴 사진 업로드</label>
        <input id="faceFileInput" type="file" name="face_images" accept="image/*" multiple>

        <div class="camera-box">
            <label>노트북 카메라로 얼굴 촬영</label>
            <div class="small-text">
                카메라를 켠 뒤 5장 촬영하면 자동으로 얼굴 등록 이미지에 포함됩니다.
            </div>

            <button class="secondary" type="button" id="startCameraBtn">
                카메라 켜기
            </button>

            <video id="cameraPreview" autoplay playsinline></video>

            <button class="success" type="button" id="captureThreeBtn">
                얼굴 5장 촬영
            </button>

            <div id="cameraStatus" class="status"></div>

            <div id="capturedPhotos" class="photo-list"></div>
        </div>

        <label>모자이크 해제할 번호판</label>
        <input type="text" name="plate_number" placeholder="예: 123가4567">

        <button id="submitBtn" type="submit">
            영상 처리 시작
        </button>

        <div id="loadingBox" class="loading-box">
            영상 처리 진행중...
            <progress id="progressBar" value="0" max="100"></progress>
            <div id="progressText">0%</div>
        </div>

    </form>

    {% if message %}
    <div class="status" style="display:block;">
        {{ message }}
    </div>
    {% endif %}

    {% if video_url %}

    <h2>처리 결과</h2>

    <video class="result-video" controls>
        <source src="{{ video_url }}" type="video/mp4">
    </video>

    <a class="download" href="{{ video_url }}" download>
        결과 영상 다운로드
    </a>

    {% endif %}

</div>

<script>
    const startCameraBtn = document.getElementById("startCameraBtn");
    const captureThreeBtn = document.getElementById("captureThreeBtn");
    const cameraPreview = document.getElementById("cameraPreview");
    const cameraStatus = document.getElementById("cameraStatus");
    const capturedPhotos = document.getElementById("capturedPhotos");
    const faceFileInput = document.getElementById("faceFileInput");

    const form = document.getElementById("processForm");
    const submitBtn = document.getElementById("submitBtn");
    const loadingBox = document.getElementById("loadingBox");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    let cameraStream = null;
    let capturedFiles = [];

    // =========================
    // 효과음
    // =========================

    function playBeep(freq = 800, duration = 150) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.00001,
            ctx.currentTime + duration / 1000
        );

        osc.stop(ctx.currentTime + duration / 1000);
    }

    function playShutter() {
        playBeep(1200, 120);

        setTimeout(() => {
            playBeep(800, 180);
        }, 80);
    }

    // =========================
    // 상태 출력
    // =========================

    function showStatus(message) {
        cameraStatus.style.display = "block";
        cameraStatus.innerText = message;
    }

    // =========================
    // 카메라 시작
    // =========================

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: "user"
                },
                audio: false
            });

            cameraPreview.srcObject = cameraStream;
            cameraPreview.style.display = "block";

            showStatus("카메라가 켜졌습니다.");
        }
        catch (err) {
            console.error(err);

            showStatus(
                "카메라 접근 실패. 브라우저 권한을 허용해주세요."
            );
        }
    }

    // =========================
    // 사진 1장 캡처
    // =========================

    function captureOne(index) {

        return new Promise((resolve) => {

            const canvas = document.createElement("canvas");

            const width = cameraPreview.videoWidth || 1280;
            const height = cameraPreview.videoHeight || 720;

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
                cameraPreview,
                0,
                0,
                width,
                height
            );

            canvas.toBlob((blob) => {

                const file = new File(
                    [blob],
                    `camera_face_${index}.jpg`,
                    {
                        type: "image/jpeg"
                    }
                );

                resolve({
                    file,
                    url: canvas.toDataURL("image/jpeg")
                });

            }, "image/jpeg", 0.95);

        });

    }

    // =========================
    // 카운트다운
    // =========================

    async function countdown() {

        for (let i = 3; i >= 1; i--) {

            showStatus(`${i}초 후 촬영`);

            playBeep(1000, 120);

            await new Promise(resolve =>
                setTimeout(resolve, 1000)
            );
        }

    }

    // =========================
    // 5장 촬영
    // =========================

    async function captureThreePhotos() {

        if (!cameraStream) {
            showStatus("먼저 카메라를 켜주세요.");
            return;
        }

        capturedFiles = [];
        capturedPhotos.innerHTML = "";

        showStatus(
            "총 5장을 촬영합니다.\n정면 / 좌 / 우 방향으로 움직여주세요."
        );

        for (let i = 1; i <= 5; i++) {

            await countdown();

            playShutter();

            showStatus(`${i}번째 사진 촬영 완료`);

            const result = await captureOne(i);

            capturedFiles.push(result.file);

            const img = document.createElement("img");

            img.src = result.url;

            capturedPhotos.appendChild(img);

            // 다음 촬영 전 잠깐 대기
            await new Promise(resolve =>
                setTimeout(resolve, 1200)
            );
        }

        // =========================
        // 기존 업로드 파일 + 카메라 파일 합치기
        // =========================

        const dataTransfer = new DataTransfer();

        for (const file of faceFileInput.files) {
            dataTransfer.items.add(file);
        }

        for (const file of capturedFiles) {
            dataTransfer.items.add(file);
        }

        faceFileInput.files = dataTransfer.files;

        showStatus(
            `촬영 완료!\n카메라 사진 ${capturedFiles.length}장이 얼굴 등록 이미지에 추가되었습니다.`
        );
    }

    // =========================
    // 이벤트
    // =========================

    startCameraBtn.addEventListener(
        "click",
        startCamera
    );

    captureThreeBtn.addEventListener(
        "click",
        captureThreePhotos
    );

    // =========================
    // 진행률 UI
    // =========================

    form.addEventListener("submit", () => {

        submitBtn.disabled = true;

        submitBtn.innerText = "처리 중...";

        loadingBox.style.display = "block";

        let value = 0;

        const interval = setInterval(() => {

            value += 1;

            if (value >= 95) {
                value = 95;
                clearInterval(interval);
            }

            progressBar.value = value;

            progressText.innerText =
                value + "%";

        }, 1000);

    });

</script>

</body>
</html>
